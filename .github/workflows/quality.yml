name: Quality policy
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Official action commit SHAs verified through GitHub API on 2026-09-25.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Verify declared changes against the actual PR base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/quality_gate.py --base "$BASE_SHA"
      - name: Test the policy checker
        run: python3 scripts/test_quality_gate.py
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --legacy-peer-deps
      - name: Run existing lint and isolated API tests
        run: npm run quality
